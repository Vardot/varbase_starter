  body:
    - value: "<div class=\"row mt-3\">\r\n  <div class=\"col-12 col-sm-6\">\r\n    <h3>Flexible Content And Fields</h3>\r\n    <p>Easily customize the structure of your content fields using Content types. Each content type can be assigned different view modes using <a href=\"https://www.drupal.org/project/ds\" target=\"_self\">Display suite</a> that can be displayed using views.</p>\r\n  </div>\r\n  <div class=\"col-12 col-sm-6\">\r\n    <h3>Powerful Landing Page Builder</h3>\r\n    <p>Using Layout Builder, you can add text with a WYSIWYG-editor, pictures, media, galleries, carousels, headers, complex layouts to your pages and change the order by dragging and dropping the content wherever you like it.</p>\r\n  </div></div>\r\n<div class=\"row mt-3 mb-3\">\r\n  <div class=\"col-12 col-sm-6\">\r\n    <h3>Versioned Content</h3>\r\n    <p>Manage content utilizing automatic versioning with historical edits. Compare previous version using <a href=\"https://www.drupal.org/project/diff\" target=\"_self\">Diff module</a>, and get an automated log message for your changes using <a href=\"https://www.drupal.org/project/revision_log_default\" target=\"_self\">Revision Log Default</a>.</p>\r\n  </div>\r\n  <div class=\"col-12 col-sm-6\">\r\n    <h3>Administration Dashboard</h3>\r\n    <p>Varbase comes with <a href=\"https://www.drupal.org/project/varbase_dashboards\" target=\"_self\">Varbase Dashboards</a> that is built on top of <a href=\"https://www.drupal.org/project/dashboards\" target=\"_self\">Dashboards with Layout Builder module</a>, utilizing , and several enhanced blocks and widgets for an intuitive and flexible administration experience.</p>\r\n  </div>\r\n</div>\r\n<div class=\"row\">\r\n  <div class=\"col-12\">\r\n    <a class=\"btn btn-primary btn-lg\" href=\"https://www.vardot.com/en/solutions/varbase\"  target=\"_self\" rel=\"noopener\" tabindex=\"-1\">See All Varbase's Features</a>\r\n  </div>\r\n</div>\r\n"
      format: content_format
      summary: ""
