                    type: offset
        'display.date_block.display_options.exposed_form.options.bef.filter.carried_keywords.plugin_id': bef_hidden
        'display.date_block.display_options.exposed_form.options.bef.filter.created':
          plugin_id: default
          advanced:
            hide_label: true
            rewrite:
              filter_rewrite_values: '- Any -|Any time'
              filter_rewrite_values_key: false
        display.page.display_options.enabled: false
        # Keyword-only filters, so the header form has no Date Published group.
        display.block_1:
          id: block_1
          display_title: 'Header search form'
          display_plugin: block
          position: 5
          display_options:
            filters:
              search_api_fulltext:
                id: search_api_fulltext
                table: search_api_index_content
                field: search_api_fulltext
                relationship: none
                group_type: group
                admin_label: ''
                plugin_id: search_api_fulltext
                operator: or
                value: ''
                group: 1
                exposed: true
                expose:
                  operator_id: search_api_fulltext_op
                  label: 'Search by keyword'
                  description: ''
                  use_operator: false
                  operator: search_api_fulltext_op
                  operator_limit_selection: false
                  operator_list: {  }
                  identifier: keywords
                  required: false
                  remember: false
                  multiple: false
                  remember_roles:
                    authenticated: authenticated
                  expose_fields: false
                  placeholder: 'Search by keyword'
                  searched_fields_id: search_api_fulltext_searched_fields
                  value_maxlength: 128
                  value_max_words: null
                is_grouped: false
                group_info:
                  label: ''
                  description: ''
                  identifier: ''
                  optional: true
                  widget: select
                  multiple: false
                  remember: false
                  default_group: All
                  default_group_multiple: {  }
                  group_items: {  }
                parse_mode: terms
                min_length: null
                fields: {  }
              search_api_datasource:
                id: search_api_datasource
                table: search_api_index_content
                field: search_api_datasource
                plugin_id: search_api_options
                operator: or
                value:
                  'entity:node': 'entity:node'
                group: 1
                exposed: false
            filter_groups:
              operator: AND
              groups:
                1: AND
            defaults:
              filters: false
              filter_groups: false
            exposed_block: true
            display_extenders: {  }
            display_description: 'Exposed search form for the header region.'
    # The header search box is wired here, after the block_1 display exists,
    # instead of in config/.
    #
    # A recipe imports everything under config/ before it runs config.actions.
    # Shipping the component and the header placement as config files therefore
    # resolved the views_exposed_filter_block:search-block_1 block plugin while
    # the display that provides it was still missing: the install logged the
    # plugin as not found three times, and Canvas minted the component from the
    # fallback plugin, so the header region stayed pinned to a component version
    # that no longer matched the component once the display did exist.
    #
    # Creating the component and placing it in the header from here keeps both
    # after the display, which is the only ordering the block plugin can be
    # resolved in.
    canvas.component.block.views_exposed_filter_block.search-block_1:
      createIfNotExists:
        langcode: en
        status: true
        dependencies:
          config:
            - views.view.search
          module:
            - views
        active_version: abd3c7419d413cec
        versioned_properties:
          active:
            settings:
              default_settings:
                id: 'views_exposed_filter_block:search-block_1'
                label: 'Exposed form: search-block_1'
                label_display: '0'
                provider: views
                views_label: ''
            fallback_metadata:
              slot_definitions: null
        label: 'Exposed form: search-block_1'
        id: block.views_exposed_filter_block.search-block_1
        provider: views
        source: block
        source_local_id: 'views_exposed_filter_block:search-block_1'
    canvas.page_region.vartheme_bs5.header:
      setProperties:
        component_tree.64cc6d33-c24c-45be-a52b-1deb85fcab0b:
          parent_uuid: afd25b14-039e-464e-8c0c-4ca7eeeeae9c
          slot: content
          uuid: 64cc6d33-c24c-45be-a52b-1deb85fcab0b
          component_id: block.views_exposed_filter_block.search-block_1
          component_version: abd3c7419d413cec
          inputs:
            label: Search
            label_display: '0'
            views_label: ''
    package_manager.settings:
