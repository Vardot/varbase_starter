name: Varbase Starter
type: Site
description: 'Designed for teams starting a new Varbase site, this template features ready-made home, about, features, blog and contact pages, with blog posts, a media library, search, a contact form and built-in SEO and accessibility tools.'
recipes:
  - varbase_users_base
  - drupal_cms_anti_spam
  - drupal_cms_authentication
  - drupal_cms_forms
  - drupal_cms_seo_basic
  - drupal_cms_seo_tools
  - drupal_cms_accessibility_tools
  - drupal_cms_search
  - easy_email_express
  - varbase_admin_base
  - varbase_security_base
  - varbase_media_base
  - varbase_editor_base
  - varbase_content_base
  - varbase_canvas_base
  - varbase_workflow_base
  - varbase_search_base
  - varbase_seo_base
  - varbase_webform_base
  - varbase_page_base
  - varbase_blog_base
  - varbase_performance_base
  - varbase_demo_content
install:
  - vartheme_bs5
  - better_exposed_filters
  - canvas_page_template_component
config:
  strict: false
  actions:
    # Canvas makes a component for every block as soon as the block exists, and
    # labels it in the install language, so on a non-English install a component
    # Canvas made before this recipe has another version than the English one
    # the templates, patterns and regions pin. Keep the English version beside
    # it as an older version. Only blocks whose label is translated.
    canvas.component.block.system_branding_block:
      simpleConfigUpdate:
        versioned_properties.7d528e00f56b3abf:
          settings:
            default_settings:
              id: system_branding_block
              label: Site branding
              label_display: '0'
              provider: system
              use_site_logo: true
              use_site_name: true
              use_site_slogan: true
          fallback_metadata:
            slot_definitions: null
    canvas.component.block.system_breadcrumb_block:
      simpleConfigUpdate:
        versioned_properties.0d7e961dd03aa710:
          settings:
            default_settings:
              id: system_breadcrumb_block
              label: Breadcrumbs
              label_display: '0'
              provider: system
          fallback_metadata:
            slot_definitions: null
    canvas.component.block.views_block.blog-latest:
      simpleConfigUpdate:
        versioned_properties.c336f6157683ac13:
          settings:
            default_settings:
              id: views_block:blog-latest
              label: 'Blog: Latest blog posts'
              label_display: '0'
              provider: views
              views_label: ''
              items_per_page: null
              exposed: {  }
          fallback_metadata:
            slot_definitions: null
    canvas.component.block.webform_block:
      simpleConfigUpdate:
        versioned_properties.b5dca6ca0519bf1b:
          settings:
            default_settings:
              id: webform_block
              label: Webform
              label_display: '0'
              provider: webform
              webform_id: ''
              default_data: ''
              redirect: false
              lazy: false
          fallback_metadata:
            slot_definitions: null
    system.site:
      simpleConfigUpdate:
        page.front: '/home'
    system.theme:
      simpleConfigUpdate:
        default: vartheme_bs5
    # Brand kit: config/canvas.color.* ships the Bootstrap 5.3 colours with
    # Bootstrap's own variable names and the theme's values, so a fresh site
    # looks as before. The theme loads the brand kit after its own CSS. This
    # global CSS derives what Bootstrap compiles as literals or rgb triplets.
    # setProperties saves the entity, so Canvas writes the CSS file.
    canvas.asset_library.global:
      setProperties:
        css.original: &brand_kit_css |
          /* Varbase Starter brand kit: derives from the Bootstrap colours in Canvas > Brand kit what Bootstrap compiles as literals or rgb triplets. Fallbacks are the theme's values. */
          :root:root {
            --bs-success-bg-subtle: color-mix(in srgb, var(--bs-success, #198754) 20%, #fff);
            --bs-success-border-subtle: color-mix(in srgb, var(--bs-success, #198754) 40%, #fff);
            --bs-success-text-emphasis: color-mix(in srgb, var(--bs-success, #198754) 40%, #000);
            --bs-info-bg-subtle: color-mix(in srgb, var(--bs-info, #0dcaf0) 20%, #fff);
            --bs-info-border-subtle: color-mix(in srgb, var(--bs-info, #0dcaf0) 40%, #fff);
            --bs-info-text-emphasis: color-mix(in srgb, var(--bs-info, #0dcaf0) 40%, #000);
            --bs-warning-bg-subtle: color-mix(in srgb, var(--bs-warning, #ffc107) 20%, #fff);
            --bs-warning-border-subtle: color-mix(in srgb, var(--bs-warning, #ffc107) 40%, #fff);
            --bs-warning-text-emphasis: color-mix(in srgb, var(--bs-warning, #ffc107) 40%, #000);
            --bs-danger-bg-subtle: color-mix(in srgb, var(--bs-danger, #dc3545) 20%, #fff);
            --bs-danger-border-subtle: color-mix(in srgb, var(--bs-danger, #dc3545) 40%, #fff);
            --bs-danger-text-emphasis: color-mix(in srgb, var(--bs-danger, #dc3545) 40%, #000);
            --bs-primary-border-subtle: var(--bs-primary, #0d6efd);
            --bs-focus-ring-color: color-mix(in srgb, var(--bs-primary, #0d6efd) calc(var(--bs-focus-ring-opacity, 0.25) * 100%), transparent);
          }

          /* Utilities Bootstrap builds from --bs-*-rgb triplets. */
          .text-primary.text-primary { color: color-mix(in srgb, var(--bs-primary, #0d6efd) calc(var(--bs-text-opacity, 1) * 100%), transparent) !important; }
          .bg-primary.bg-primary, .text-bg-primary.text-bg-primary { background-color: color-mix(in srgb, var(--bs-primary, #0d6efd) calc(var(--bs-bg-opacity, 1) * 100%), transparent) !important; }
          .border-primary.border-primary { border-color: color-mix(in srgb, var(--bs-primary, #0d6efd) calc(var(--bs-border-opacity, 1) * 100%), transparent) !important; }
          .link-primary.link-primary { color: color-mix(in srgb, var(--bs-primary, #0d6efd) calc(var(--bs-link-opacity, 1) * 100%), transparent) !important; text-decoration-color: color-mix(in srgb, var(--bs-primary, #0d6efd) calc(var(--bs-link-underline-opacity, 1) * 100%), transparent) !important; }
          .link-underline-primary.link-underline-primary { text-decoration-color: color-mix(in srgb, var(--bs-primary, #0d6efd) calc(var(--bs-link-underline-opacity, 1) * 100%), transparent) !important; }
          .focus-ring-primary.focus-ring-primary { --bs-focus-ring-color: color-mix(in srgb, var(--bs-primary, #0d6efd) calc(var(--bs-focus-ring-opacity, 0.25) * 100%), transparent); }
          body .border-top-primary.border-top-primary { border-top-color: var(--bs-primary, #0d6efd) !important; }
          body .border-bottom-primary.border-bottom-primary { border-bottom-color: var(--bs-primary, #0d6efd) !important; }
