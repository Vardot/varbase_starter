name: Varbase Starter
type: Site
description: 'A starter site template recipe for Varbase, providing a modern recipe-first approach to initializing Varbase sites.'
recipes:
  - varbase_users_base
  - drupal_cms_admin_ui
  - drupal_cms_anti_spam
  - drupal_cms_authentication
  - drupal_cms_forms
  - drupal_cms_media
  - drupal_cms_privacy_basic
  - drupal_cms_seo_basic
  - drupal_cms_seo_tools
  - drupal_cms_accessibility_tools
  - easy_email_express
  - varbase_admin_base
  - varbase_security_base
  - varbase_media_base
  - varbase_editor_base
  - varbase_content_base
  - varbase_workflow_base
  - varbase_seo_base
  - varbase_webform_base
  - varbase_page_base
  - varbase_blog_base
  - varbase_performance_base
  - varbase_demo_content
install:
  - vartheme_bs5
config:
  strict: false
  import:
    vartheme_bs5:
    - block.block.vartheme_bs5_branding 
    - block.block.vartheme_bs5_breadcrumbs 
    - block.block.vartheme_bs5_content 
    - block.block.vartheme_bs5_copyright 
    - block.block.vartheme_bs5_footer_logo 
    - block.block.vartheme_bs5_footer_sitemap 
    - block.block.vartheme_bs5_footer 
    - block.block.vartheme_bs5_help 
    - block.block.vartheme_bs5_local_actions 
    - block.block.vartheme_bs5_local_tasks 
    - block.block.vartheme_bs5_main_menu 
    - block.block.vartheme_bs5_messages 
    - block.block.vartheme_bs5_social_media_menu 
  actions:
    system.site:
      simpleConfigUpdate:
        page.front: '/home'
    system.theme:
      simpleConfigUpdate:
        default: vartheme_bs5
    package_manager.settings:
      simpleConfigUpdate:
        additional_trusted_composer_plugins:
          - vardot/varbase
          - drupal/varbase_starter
          - composer/installers
          - cweagans/composer-patches
          - oomphinc/composer-installers-extender
          - drupal/core-composer-scaffold
          - drupal/core-project-message
          - dealerdirect/phpcodesniffer-composer-installer
          - phpstan/extension-installer
          - php-http/discovery
          - tbachert/spi
    project_browser.admin_settings:
      simpleConfigUpdate:
        enabled_sources:
          recommended:
            # @see recommended.yml
            uri: 'https://git.drupalcode.org/api/v4/projects/201141/repository/files/recommended.yml/raw?ref=HEAD'
            ttl: 1
          drupalorg_jsonapi: []
          varbase_recipes: []
        default_source: recommended
    ckeditor_media_embed.settings:
      setCKEditorMediaEmbedVersion: true
    # Disable Canvas components that aren't really useful in building pages or
    # content templates.
    canvas.component.block.announce_block:
      disable: []
    canvas.component.block.dashboard_placeholder:
      disable: []
    canvas.component.block.dashboard_site_status:
      disable: []
    canvas.component.block.help_block:
      disable: []
    canvas.component.block.local_actions_block:
      disable: []
    canvas.component.block.local_tasks_block:
      disable: []
    canvas.component.block.navigation_dashboard:
      disable: []
    canvas.component.block.navigation_link:
