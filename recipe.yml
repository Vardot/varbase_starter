              expose_fields: false
              placeholder: ''
              searched_fields_id: search_api_fulltext_searched_fields
              value_maxlength: 128
              value_max_words: null
            is_grouped: false
            group_info:
              label: ''
              description: ''
              identifier: ''
              optional: true
              widget: select
              multiple: false
              remember: false
              default_group: All
              default_group_multiple: {  }
              group_items: {  }
            parse_mode: terms
            min_length: null
            fields: {  }
          created:
            id: created
            table: search_api_index_content
            field: created
            relationship: none
            group_type: group
            admin_label: ''
            plugin_id: search_api_date
            operator: '>='
            value:
              min: ''
              max: ''
              value: ''
              type: offset
            group: 1
            exposed: true
            expose:
              operator_id: created_op
              label: 'Date Published'
              description: ''
              use_operator: false
              operator: created_op
              operator_limit_selection: false
              operator_list: {  }
              identifier: published
              required: false
              remember: false
              multiple: false
              remember_roles:
                authenticated: authenticated
            is_grouped: true
            group_info:
              label: 'Date Published'
              description: ''
              identifier: published
              optional: true
              widget: radios
              multiple: false
              remember: false
              default_group: All
              default_group_multiple: {  }
              group_items:
                1:
                  title: 'Past 24 hours'
                  operator: '>='
                  value:
                    min: ''
                    max: ''
