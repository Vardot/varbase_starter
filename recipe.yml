name: Varbase Starter
type: Site
description: 'A starter site template recipe for Varbase, providing a modern recipe-first approach to initializing Varbase sites.'
recipes:
  - varbase_users_base
  - drupal_cms_admin_ui
  - drupal_cms_anti_spam
  - drupal_cms_authentication
  - drupal_cms_forms
  - drupal_cms_media
  - drupal_cms_privacy_basic
  - drupal_cms_seo_basic
  - drupal_cms_seo_tools
  - drupal_cms_accessibility_tools
  - drupal_cms_search
  - easy_email_express
  - varbase_admin_base
  - varbase_security_base
  - varbase_media_base
  - varbase_editor_base
  - varbase_content_base
  - varbase_workflow_base
  - varbase_seo_base
  - varbase_webform_base
  - varbase_page_base
  - varbase_blog_base
  - varbase_performance_base
  - varbase_demo_content
install:
  - vartheme_bs5
  - better_exposed_filters
config:
  strict: false
  actions:
    system.site:
      simpleConfigUpdate:
        page.front: '/home'
    system.theme:
      simpleConfigUpdate:
        default: vartheme_bs5
    # The header search box shows the placeholder as its only prompt, so it
    # carries the header design's wording instead of the Drupal CMS Search
    # default. Set here rather than by patching that third-party recipe.
    #
    # The results page needs one readable result per row. The index holds both
    # nodes and Canvas pages, so the view ships one title field per entity type
    # and only ever fills one of them, which left an empty heading beside the
    # real one in every row. Both are carried as sources now and a single linked
    # heading is built from whichever is set, sized at the design system's h4
    # step instead of the display h2 step, and followed by the excerpt. The page
    # title comes from the Vartheme BS5 search view component, so no header area
    # repeats it.
    #
    # The search box belongs on the results page, so the page display renders
    # its exposed form inline. The header popover keeps a block of its own
    # through a dedicated block display, because turning the page display's
    # exposed block off would otherwise remove the block the header points at.
    views.view.search:
      simpleConfigUpdate:
        display.default.display_options.filters.search_api_fulltext.expose.placeholder: 'Search by keyword'
        display.page.display_options.exposed_block: false
        display.block_1:
          id: block_1
          display_title: 'Header search form'
          display_plugin: block
          position: 3
          display_options:
            exposed_block: true
            display_extenders: {  }
            display_description: 'Exposed search form for the header region.'
        display.default.display_options.style:
          type: default
          options:
            row_class: mb-5
            default_row_class: true
        display.default.display_options.header:
          result:
            id: result
            table: views
            field: result
            relationship: none
            group_type: group
            admin_label: ''
            plugin_id: result
            empty: false
            content: 'Displaying @start - @end of @total results'
        display.default.display_options.fields:
