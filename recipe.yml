name: Varbase Starter
type: Site
description: 'Designed for teams starting a new Varbase site, this template features ready-made home, about, features, blog and contact pages, with blog posts, a media library, search, a contact form and built-in SEO and accessibility tools.'
recipes:
  - varbase_users_base
  - drupal_cms_anti_spam
  - drupal_cms_authentication
  - drupal_cms_forms
  - drupal_cms_seo_basic
  - drupal_cms_seo_tools
  - drupal_cms_accessibility_tools
  - drupal_cms_search
  - easy_email_express
  - varbase_admin_base
  - varbase_security_base
  - varbase_media_base
  - varbase_editor_base
  - varbase_content_base
  - varbase_canvas_base
  - varbase_workflow_base
  - varbase_search_base
  - varbase_seo_base
  - varbase_webform_base
  - varbase_page_base
  - varbase_blog_base
  - varbase_performance_base
  - varbase_demo_content
install:
  - vartheme_bs5
  - better_exposed_filters
  - canvas_page_template_component
config:
  strict: false
  actions:
    system.site:
      simpleConfigUpdate:
        page.front: '/home'
    system.theme:
      simpleConfigUpdate:
        default: vartheme_bs5
    # Tag names are indexed for the Tags facet.
    search_api.index.content:
      setProperties:
        field_settings.tag_name:
          label: 'Tags » Name'
          datasource_id: 'entity:node'
          property_path: 'field_tags:entity:name'
          type: string
          dependencies:
            config:
              - field.storage.node.field_tags
            module:
              - taxonomy
    # Created before the view save below, so results_block gets its cache tag.
    facets.facet.search_tags:
      createIfNotExists:
        status: true
        dependencies:
          config:
            - search_api.index.content
            - views.view.search
          module:
            - search_api
        id: search_tags
        name: Tags
        weight: 0
        min_count: 1
        missing: false
        missing_label: others
        url_alias: tags
        facet_source_id: 'search_api:views_block__search__results_block'
        field_identifier: tag_name
        query_operator: or
        hard_limit: null
        exclude: false
        use_hierarchy: false
        keep_hierarchy_parents_active: false
        hierarchy:
          type: taxonomy
          config: {  }
        expand_hierarchy: false
        enable_parent_when_child_gets_disabled: true
        widget:
          type: checkbox
          config:
            show_numbers: true
            soft_limit: 8
            soft_limit_settings:
              show_less_label: 'Show less'
              show_more_label: 'Show more'
        empty_behavior:
          behavior: none
        only_visible_when_facet_source_is_visible: null
        show_only_one_result: false
        show_title: null
        processor_configs:
          url_processor_handler:
            processor_id: url_processor_handler
            weights:
              pre_query: -10
              build: -10
            settings: {  }
          list_item:
            processor_id: list_item
            weights:
              build: 5
            settings: {  }
          display_value_widget_order:
            processor_id: display_value_widget_order
            weights:
              sort: 20
            settings:
              sort: ASC
    canvas.component.block.facet_block.search_tags:
      createIfNotExists:
        status: true
        dependencies:
          config:
            - facets.facet.search_tags
          module:
            - facets
        active_version: d00841ff0ca81da9
        versioned_properties:
          active:
            settings:
              default_settings:
                id: 'facet_block:search_tags'
                label: Tags
                label_display: '0'
                provider: facets
            fallback_metadata:
              slot_definitions: null
        label: Tags
        id: block.facet_block.search_tags
        provider: facets
        source: block
        source_local_id: 'facet_block:search_tags'
    # Leaf keys only, on top of varbase_search_base.
    views.view.search:
      setProperties:
        display.default.display_options.filters.search_api_fulltext.expose.placeholder: 'Search by keyword'
        display.default.display_options.header.result.content: 'Displaying @start - @end of @total results'
        display.default.display_options.empty.area_text_custom.content: '<p class="fs-5">No results match your search. Try other keywords or clear the filters.</p>'
        display.default.display_options.style:
          type: default
          options:
            row_class: mb-4
            default_row_class: true
        'display.results_block.display_options.row.options.view_modes.entity:node.blog': search_result
        # Each search form shows its own field and carries the other's as hidden.
        'display.results_block.display_options.defaults.exposed_form': false
        'display.results_block.display_options.exposed_form':
          type: bef
          options:
            submit_button: Search
            reset_button: false
            reset_button_label: Reset
            exposed_sorts_label: 'Sort by'
            expose_sort_order: false
            sort_asc_label: Asc
            sort_desc_label: Desc
            text_input_required: '<p>Enter a keyword to search the site.</p>'
            text_input_required_format: content_format
            bef:
              general:
                input_required: true
              filter:
                search_api_fulltext:
                  plugin_id: default
                  advanced:
                    hide_label: true
                created:
                  plugin_id: bef_hidden
        # Own filter id, so the base's search_api_fulltext settings do not apply.
        'display.date_block.display_options.defaults.filters': false
        'display.date_block.display_options.defaults.filter_groups': false
        'display.date_block.display_options.filter_groups':
          operator: AND
          groups:
            1: AND
        'display.date_block.display_options.filters':
          carried_keywords:
            id: carried_keywords
            table: search_api_index_content
            field: search_api_fulltext
            relationship: none
            group_type: group
            admin_label: ''
            plugin_id: search_api_fulltext
            operator: or
            value: ''
            group: 1
            exposed: true
            expose:
              operator_id: search_api_fulltext_op
              label: 'Search by keyword'
              description: ''
              use_operator: false
              operator: search_api_fulltext_op
              operator_limit_selection: false
