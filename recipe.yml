name: Varbase
type: Site
description: 'A starter site template recipe for Varbase, providing a modern recipe-first approach to initializing Varbase sites.'
recipes:
  - core/recipes/administrator_role
  - core/recipes/content_editor_role
  - core/recipes/core_recommended_maintenance
  - core/recipes/core_recommended_performance
  - drupal_cms_admin_ui
  - drupal_cms_anti_spam
  - drupal_cms_authentication
  - drupal_cms_blog
  - drupal_cms_forms
  - drupal_cms_media
  - drupal_cms_privacy_basic
  - drupal_cms_seo_basic
  - drupal_cms_seo_tools
  - drupal_cms_accessibility_tools
  - easy_email_express
  - varbase_admin_base
  - varbase_security_base
  - varbase_media_base
  - varbase_editor_base
  - varbase_content_base
  - varbase_workflow_base
  - varbase_webform_base
  - varbase_demo_content
install:
  - cva
  - vartheme_bs5
  - project_browser
config:
  strict: false
  import:
    vartheme_bs5:
    - block.block.vartheme_bs5_branding 
    - block.block.vartheme_bs5_breadcrumbs 
    - block.block.vartheme_bs5_content 
    - block.block.vartheme_bs5_copyright 
    - block.block.vartheme_bs5_footer_logo 
    - block.block.vartheme_bs5_footer_sitemap 
    - block.block.vartheme_bs5_footer 
    - block.block.vartheme_bs5_help 
    - block.block.vartheme_bs5_local_actions 
    - block.block.vartheme_bs5_local_tasks 
    - block.block.vartheme_bs5_main_menu 
    - block.block.vartheme_bs5_messages 
    - block.block.vartheme_bs5_social_media_menu 
  actions:
    system.site:
      simpleConfigUpdate:
        page.front: '/home'
    system.theme:
      simpleConfigUpdate:
        default: vartheme_bs5
    package_manager.settings:
      simpleConfigUpdate:
        additional_trusted_composer_plugins:
          - vardot/varbase
          - drupal/varbase_starter
          - composer/installers
          - cweagans/composer-patches
          - oomphinc/composer-installers-extender
          - drupal/core-composer-scaffold
          - drupal/core-project-message
          - dealerdirect/phpcodesniffer-composer-installer
          - phpstan/extension-installer
          - php-http/discovery
          - tbachert/spi
    project_browser.admin_settings:
      simpleConfigUpdate:
        enabled_sources:
          recommended:
            # @see recommended.yml
            uri: 'https://git.drupalcode.org/api/v4/projects/201141/repository/files/recommended.yml/raw?ref=HEAD'
            ttl: 1
          drupalorg_jsonapi: []
        default_source: recommended
    # Disable Canvas components that aren't really useful in building pages or
    # content templates.
    ?canvas.component.block.announce_block:
      disable: []
    canvas.component.block.block_content.*:
      disable: []
    ?canvas.component.block.dashboard_placeholder:
      disable: []
    ?canvas.component.block.dashboard_site_status:
      disable: []
    ?canvas.component.block.help_block:
      disable: []
    ?canvas.component.block.inline_block.basic:
      disable: []
    ?canvas.component.block.local_actions_block:
      disable: []
    ?canvas.component.block.local_tasks_block:
      disable: []
    ?canvas.component.block.navigation_dashboard:
      disable: []
    ?canvas.component.block.navigation_link:
      disable: []
    ?canvas.component.block.navigation_shortcuts:
      disable: []
    ?canvas.component.block.navigation_user:
      disable: []
    ?canvas.component.block.page_title_block:
      disable: []
    ?canvas.component.block.project_browser_block.*:
      disable: []
    ?canvas.component.block.system_clear_cache_block:
      disable: []
    ?canvas.component.block.system_menu_block.account:
      disable: []
    ?canvas.component.block.system_menu_block.admin:
      disable: []
    ?canvas.component.block.system_menu_block.content:
      disable: []
    ?canvas.component.block.system_menu_block.navigation-user-links:
      disable: []
    ?canvas.component.block.system_menu_block.social-media-menu:
      disable: []
    ?canvas.component.block.system_menu_block.tools:
      disable: []
    ?canvas.component.block.system_menu_block.top-tasks:
      disable: []
    ?canvas.component.block.user_login_block:
      disable: []
    canvas.component.block.views_block.a11y_tools_editoria11y_.*:
      disable: []
    canvas.component.block.views_block.editoria11y_.*:
      disable: []
    ?canvas.component.block.views_block.publishing_content-block_drafts:
      disable: []
    ?canvas.component.block.views_block.publishing_content-block_scheduled:
      disable: []
    ?canvas.component.block.views_block.recent_content-block_recent_content:
      disable: []
    ?canvas.component.sdc.navigation.title:
      disable: []
    ?canvas.component.sdc.vartheme_bs5.block-cta:
      disable: []
    ?canvas.component.sdc.vartheme_bs5.block-image:
      disable: []
    ?canvas.component.sdc.vartheme_bs5.block-local-video:
      disable: []
    ?canvas.component.sdc.vartheme_bs5.block-remote-video:
      disable: []
    ?canvas.component.sdc.vartheme_bs5.block-rich-text:
      disable: []
    ?canvas.component.sdc.vartheme_bs5.page-header:
      disable: []
    ?canvas.component.sdc.vartheme_bs5.page-user-edit:
      disable: []
    ?canvas.component.sdc.vartheme_bs5.page-user-login:
      disable: []
    ?canvas.component.sdc.vartheme_bs5.page-user-password:
      disable: []
    ?canvas.component.sdc.vartheme_bs5.page-user-register:
      disable: []
    ?canvas.component.sdc.vartheme_bs5.page-user-reset:
      disable: []
extra:
  recipe_installer_kit:
    finish_url: '/admin/dashboard/welcome'
